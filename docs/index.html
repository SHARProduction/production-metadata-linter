<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Production Metadata Linter | SHAR Production</title><link rel="canonical" href="https://sharproduction.github.io/production-metadata-linter/"><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;color:#18202a}textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}button{background:#172a46;color:#fff;border:0;border-radius:6px;width:auto}pre{white-space:pre-wrap;background:#f3f5f8;padding:14px;border-radius:6px}</style></head><body><h1>Production Metadata Linter</h1><p>SHAR Production is an AI-hybrid video production studio. Validate delivery metadata and declared rights state locally.</p><textarea id="data" rows="10">{"title":"Synthetic product film","project":"Demo","stage":"delivery","rights_status":"cleared"}</textarea><button id="run">Lint metadata</button><pre id="output">Ready.</pre><p><a href="https://sharprod.com/">SHAR Production</a> · MIT</p><script>run.onclick=()=>{try{let x=JSON.parse(data.value),e=[];for(let k of['title','project','stage','rights_status'])if(!x[k])e.push(k+' required');if(!['preproduction','production','postproduction','delivery'].includes(x.stage))e.push('stage invalid');if(!['cleared','licensed','synthetic'].includes(x.rights_status))e.push('rights status blocks release');output.textContent=JSON.stringify({status:e.length?'BLOCK':'PASS',errors:e},null,2)}catch(e){output.textContent='Invalid JSON: '+e.message}}</script></body></html>
